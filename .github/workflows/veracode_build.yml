name: Veracode SPFx CI CD

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      run: npm ci

    - name: Build solution
      run: gulp build

    - name: 'create an empty ./veracode folder'
      run: 'mkdir -p ./veracode'
      
    - name: 'Compress SharePoint files'
      run: tar -czvf ./veracode/sharepoint-integration.tar.gz ./lib

    
    - name: Veracode Upload And Scan (Static Application Security Testing)
      uses: veracode/veracode-uploadandscan-action@0.2.10
      with:
        appname: 'SharePoint Integration'
        createprofile: true
        filepath: 'veracode'
        vid: '${{ secrets.VERACODE_API_ID }}'
        vkey: '${{ secrets.VERACODE_API_KEY }}'

    - name: Run Veracode Software Composition Analysis (SCA)
      env:
        SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
      run: curl --silent --show-error --location https://download.sourceclear.com/ci.sh | sh -s -- scan ./ --update-advisor --allow-dirty
