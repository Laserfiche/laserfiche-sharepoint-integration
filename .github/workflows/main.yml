name: SPFx CI CD

on:
  push:
    branches: ['\d+.x']
  pull_request:
    branches: ['\d+.x']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  packagePath: sharepoint/solution/LaserficheSharePointOnlineIntegration
  packagePathUserDocs: UserDocuments
  fullVersion: 1.0.0.${{github.run_number}}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Tag commit
        if: github.ref == 'refs/heads/1.x'
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{env.fullVersion}}
          commit_sha: ${{ github.sha }}
          message: Workflow run ${{github.server_url}}/${{github.repository}}/actions/runs/${{ github.run_id}}

      - name: replace config/package-solution.json version
        run: sed -i 's/"1.0.0.0"/"${{env.fullVersion}}"/g' config/package-solution.json

      - name: replace package.json version
        run: sed -i 's/"1.0.0.0"/"${{env.fullVersion}}"/g' package.json

      - name: Install dependencies
        run: npm ci

      - name: Build solution
        run: gulp build

      - name: Bundle and package
        run: |
          gulp bundle --ship
          gulp package-solution --ship

      - name: Rename .sppkg to include version
        run: mv ${{ env.packagePath }}.sppkg ${{ env.packagePath }}.${{ env.fullVersion }}.sppkg

      - name: Run tests
        run: npm run test

      - name: Upload Build Package
        uses: actions/upload-artifact@v4
        with:
          path: |
            ${{ env.packagePath }}.${{ env.fullVersion }}.sppkg
            ${{ env.packagePathUserDocs }}
